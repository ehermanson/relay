name: Desktop

on:
  pull_request:
    paths:
      [
        "desktop/**",
        "server/**",
        "app/**",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/desktop.yml",
      ]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed native updates from main (requires signing secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:test
      - run: pnpm desktop:pack
      - name: Configure Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root desktop-release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop-release/linux-unpacked/chrome-sandbox
      - name: Smoke native runtime
        shell: bash
        env:
          RELAY_DESKTOP_SMOKE: "1"
          RELAY_DESKTOP_BENCHMARK: "1"
          RELAY_DESKTOP_UPDATE_SMOKE: "1"
          RELAY_DESKTOP_RECOVERY_SMOKE: "1"
        run: |
          export RELAY_DESKTOP_HOME="${RUNNER_TEMP}/relay-desktop-smoke"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a desktop-release/linux-unpacked/relay-desktop
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            APP=$(find desktop-release -maxdepth 2 -name Relay.app -print -quit)
            "$APP/Contents/MacOS/Relay"
          else
            desktop-release/win-unpacked/Relay.exe
          fi
      - name: Archive executable permissions and framework symlinks
        shell: bash
        run: tar -czf "relay-native-$RUNNER_OS-$RUNNER_ARCH.tar.gz" -C desktop-release .
      - uses: actions/upload-artifact@v4
        with:
          name: relay-desktop-${{ runner.os }}-${{ runner.arch }}
          path: relay-native-*.tar.gz
          retention-days: 7

  prepare-release:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.RELAY_DESKTOP_RELEASES == 'true'))
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      release-id: ${{ steps.prepare.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or reuse an unpublished release for this main commit
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.$(git rev-list --count HEAD)"
          TAG="v$VERSION"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]' |
            jq -s --arg tag "$TAG" 'map(select(.tag_name == $tag)) | first // null' > release.json
          if [[ "$(jq -r '.id // empty' release.json)" != "" ]]; then
            test "$(jq -r '.draft' release.json)" = true || { echo "This native version is already published; refusing to mutate it."; exit 1; }
            test "$(jq -r '.target_commitish' release.json)" = "$GITHUB_SHA" || { echo "The existing draft belongs to a different commit."; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Relay $VERSION" -F draft=true -F prerelease=false > release.json
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release-id=$(jq -r '.id' release.json)" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELAY_DESKTOP_VERSION: ${{ needs.prepare-release.outputs.version }}
      RELAY_DESKTOP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require signing credentials for distributed platforms
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.RELAY_MAC_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.RELAY_WINDOWS_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.RELAY_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.RELAY_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.RELAY_APPLE_API_ISSUER }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.RELAY_MAC_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.RELAY_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -n "$MAC_CERTIFICATE" && test -n "$MAC_CERTIFICATE_PASSWORD" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER" || { echo "Configure macOS signing and notarization secrets before publishing."; exit 1; }
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            test -n "$WINDOWS_CERTIFICATE" && test -n "$WINDOWS_CERTIFICATE_PASSWORD" || { echo "Configure Windows signing secrets before publishing."; exit 1; }
          fi
      - name: Prepare notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          API_KEY: ${{ secrets.RELAY_APPLE_API_KEY }}
        run: |
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build signed native artifacts and upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.RELAY_MAC_CERTIFICATE || runner.os == 'Windows' && secrets.RELAY_WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.RELAY_MAC_CERTIFICATE_PASSWORD || runner.os == 'Windows' && secrets.RELAY_WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.RELAY_APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.RELAY_APPLE_API_ISSUER || '' }}
        run: pnpm desktop:release

  publish-release:
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
    needs: [prepare-release, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after every platform uploaded its complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          jq -e --arg tag "v$VERSION" --arg sha "$GITHUB_SHA" '
            .draft == true and .tag_name == $tag and .target_commitish == $sha and
            ([.assets[].name] as $names |
              ($names | index("latest.yml") != null) and
              ($names | index("latest-mac.yml") != null) and
              ($names | index("latest-linux.yml") != null) and
              any($names[]; endswith(".dmg")) and
              any($names[]; endswith(".zip")) and
              any($names[]; endswith(".exe")) and
              any($names[]; endswith(".AppImage")))
          ' release.json > /dev/null || { echo "The draft is incomplete or does not match this main commit; leaving it unpublished."; exit 1; }
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false > /dev/null
