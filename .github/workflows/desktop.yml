name: Desktop

on:
  pull_request:
    paths:
      [
        "desktop/**",
        "server/**",
        "app/**",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/desktop.yml",
      ]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed native updates (requires signing secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:test
      - run: pnpm desktop:pack
      - name: Smoke native runtime
        shell: bash
        env:
          RELAY_DESKTOP_SMOKE: "1"
          RELAY_DESKTOP_BENCHMARK: "1"
          RELAY_DESKTOP_UPDATE_SMOKE: "1"
          RELAY_DESKTOP_RECOVERY_SMOKE: "1"
        run: |
          export RELAY_DESKTOP_HOME="${RUNNER_TEMP}/relay-desktop-smoke"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a desktop-release/linux-unpacked/relay-desktop
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            APP=$(find desktop-release -maxdepth 2 -name Relay.app -print -quit)
            "$APP/Contents/MacOS/Relay"
          else
            desktop-release/win-unpacked/Relay.exe
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: relay-desktop-${{ runner.os }}-${{ runner.arch }}
          path: desktop-release/
          retention-days: 7

  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELAY_DESKTOP_RELEASES == 'true')
    needs: package
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Derive monotonically increasing native version from main history
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "RELAY_DESKTOP_VERSION=$BASE.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "RELAY_DESKTOP_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Require signing credentials for distributed platforms
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.RELAY_MAC_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.RELAY_WINDOWS_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.RELAY_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.RELAY_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.RELAY_APPLE_API_ISSUER }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.RELAY_MAC_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.RELAY_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -n "$MAC_CERTIFICATE" && test -n "$MAC_CERTIFICATE_PASSWORD" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER" || { echo "Configure macOS signing and notarization secrets before publishing."; exit 1; }
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            test -n "$WINDOWS_CERTIFICATE" && test -n "$WINDOWS_CERTIFICATE_PASSWORD" || { echo "Configure Windows signing secrets before publishing."; exit 1; }
          fi
      - name: Prepare notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          API_KEY: ${{ secrets.RELAY_APPLE_API_KEY }}
        run: |
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build and publish native release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.RELAY_MAC_CERTIFICATE || secrets.RELAY_WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.RELAY_MAC_CERTIFICATE_PASSWORD || secrets.RELAY_WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.RELAY_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.RELAY_APPLE_API_ISSUER }}
        run: pnpm desktop:release
