<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Matches --color-bg-deep (the app's top background) so the opaque
         status bar band is seamless in the installed home-screen app. -->
    <meta name="theme-color" content="#0e0f11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque status bar: "black-translucent" puts content under the status bar,
         and iOS 26+ fills that inset with a Liquid Glass blur band that bleeds
         onto the header. Default (opaque) insets the web view below the bar,
         whose color comes from the dynamic theme-color meta above. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Relay</title>
    <script>
      try {
        var t = localStorage.getItem("relay-theme");
        var isLight = t === "light" || (t === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        if (isLight) {
          document.documentElement.classList.add("light");
          document.querySelector('meta[name="theme-color"]').content = "#f2f3f5";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
